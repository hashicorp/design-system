live-filtering: Filters will be applied automatically as selections are made
search:
  aria-label: Search
  placeholder: Search
applied-filters:
  key-value: "{keyText}: {valueText}"
  toggle-button: View applied filters
  tag:
    aria-label: Clear filter
    numerical-filter:
      between: "between {start} and {end}"
    date-filter:
      date:
        before: "before {value}"
        exactly: "exactly {value}"
        after: "after {value}"
        between: "between {start} and {end}"
      time:
        before: "before {value}"
        exactly: "exactly {value}"
        after: "after {value}"
        between: "between {start} and {end}"
    search-filter: Search
  no-filters-applied: No filters applied
  clear-filters: Clear all filters
