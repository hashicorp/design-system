version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
      interval: "monthly"
  labels:
    - "automated"
  ignore:
    # v2 requires @changesets/cli v3; remove once HDS-6835 migrates both together
    - dependency-name: "changesets/action"
      update-types: ["version-update:semver-major"]
