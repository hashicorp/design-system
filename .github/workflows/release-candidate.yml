name: Release Candidate

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

env:
  NODE_VERSION: "24.x"

jobs:
  release-candidate:
    name: Release Candidate
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'release-candidate')
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # Required so that NODE_AUTH_TOKEN is used to authenticate to the npm registry
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Components
        run: pnpm build
        working-directory: packages/components

      - name: Check for pending changesets
        id: pending
        # `changeset version` exits with an error when there are no changesets, so we skip the release steps instead
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changesets found, so no release candidate packages were published."
          fi

      - name: Version RC Packages
        id: version
        if: steps.pending.outputs.has_changesets == 'true'
        run: pnpm version-candidate-packages
        env:
          # Token setup in hashibot-hds' account
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Publish RC Packages
        id: changesets
        if: steps.pending.outputs.has_changesets == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release-candidate-packages
          create-github-releases: false
          push-git-tags: false
        env:
          # Token setup in hashibot-hds' account
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute new packages info
        id: packagesData
        if: success() && steps.changesets.outputs.published == 'true'
        # We're using the GITHUB_OUTPUT file to add step outputs (ref: https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-output-parameter)
        # for count: use jq to determine the length of the array
        # for packageList: use jq reduce to build up a string of markdown (ref: https://stedolan.github.io/jq/manual/#Reduce)
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          echo "count=$(echo "$PUBLISHED_PACKAGES" | jq '. | length')" >> "$GITHUB_OUTPUT"
          echo "packageList=$(echo "$PUBLISHED_PACKAGES" | jq -c 'reduce .[] as $item (""; . + "#### \($item.name)@\($item.version)\n```\npnpm up \($item.name)@rc\n```\n")')" >> "$GITHUB_OUTPUT"

      - name: Comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: success() && steps.changesets.outputs.published == 'true'
        with:
          header: "rc-release"
          message: |
            ### :package: RC Packages Published

            Latest commit: ${{ github.event.pull_request.head.sha }}

            <details><summary>Published ${{ steps.packagesData.outputs.count }} packages</summary>

            ${{ fromJSON(steps.packagesData.outputs.packageList) }}

            </details>

      - name: Comment (no changesets)
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: steps.pending.outputs.has_changesets == 'false'
        with:
          header: "rc-release"
          message: |
            ### :package: No RC Packages Published

            No changesets were found, so nothing was published.
