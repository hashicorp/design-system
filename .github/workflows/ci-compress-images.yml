name: Compress Images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 1 * *" # monthly: 23:00 UTC on day 1 of each month

env:
  NODE_VERSION: "24.x"

jobs:
  build:
    name: Compress Images & Open PR
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@cfe6ba91a2f0e9046d44e2088d002378daeb4a9c # main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
      - name: Open a PR if images can be compressed
        if: steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: "Compressed Image Assets"
          branch-suffix: timestamp
          commit-message: "compressed image assets"
          body: ${{ steps.calibre.outputs.markdown }}
          token: ${{ secrets.PAT_TOKEN }}
