<html>

  <head>
    <meta charset="utf-8">
    <title>Dummy Tests</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}
    {{content-for "test-head"}}

    <!-- these styles are pre-compiled in the `components` package -->
    <!-- IMPORTANT: the relevant/required entries here always need to be kept in sync with the `showcase/app/index.html` file -->

    <!-- this is the "standard" (non-themed) CSS file for the HDS components, which contains both the default HDS tokens as well as the HDS components' styles  -->
    <link rel="stylesheet" href="/assets/styles/@hashicorp/design-system-components.css">

    <!-- these are the design tokens (CSS variables) for theming [NOTE: they are disabled by default and toggled on/off via JS by the `ShwThemeSwitcher` selector] -->
    <link id="hds-tokens-with-css-selectors" rel="stylesheet" integrity="" disabled="true"
      href="/assets/styles/@hashicorp/themed-tokens/with-css-selectors/tokens.css">
    <link id="hds-tokens-with-css-selectors--migration" rel="stylesheet" integrity="" disabled="true"
      href="/assets/styles/@hashicorp/themed-tokens/with-css-selectors--migration/tokens.css">
    <link id="hds-tokens-with-css-selectors--advanced" rel="stylesheet" integrity="" disabled="true"
      href="/assets/styles/@hashicorp/themed-tokens/with-css-selectors--advanced/tokens.css">

    <!-- this is the "components-only" CSS file for the HDS components, which needs to be associated with a themed CSS tokens file to work  -->
    <link id="hds-components-stylesheet-common" rel="stylesheet" integrity="" disabled="true"
      href="/assets/styles/@hashicorp/design-system-components-common.css">

    <!-- these are the overriding styles for the Ember PowerSelect component -->
    <link rel="stylesheet" href="/assets/styles/@hashicorp/design-system-power-select-overrides.css">

    <!-- these styles are compiled with the Showcase -->
    <link rel="stylesheet" href="/@embroider/virtual/vendor.css">
    <link rel="stylesheet" href="/@embroider/virtual/app.css">

    <!-- this file is not really used -->
    <link rel="stylesheet" href="/@embroider/virtual/test-support.css">

    {{content-for "head-footer"}}
    {{content-for "test-head-footer"}}
  </head>

  <body>
    {{content-for "body"}}
    {{content-for "test-body"}}

    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <script src="/testem.js" integrity="" data-embroider-ignore></script>
    <script src="/@embroider/virtual/vendor.js"></script>
    <script src="/@embroider/virtual/test-support.js"></script>
    
    <script type="module">import "ember-testing";</script>
    <script type="module">
      import { start } from './test-helper';
      import.meta.glob("./**/*.{js,ts,gjs,gts}", { eager: true });
      start();
    </script>

    {{content-for "body-footer"}}
    
  </body>

</html>
